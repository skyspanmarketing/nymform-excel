# Lint, type-check, unit tests, release guard and end-to-end tests on every push.
name: ci
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Release build and guard (T-P4)
        run: npm run build && npm run check:release
      - name: Bench build compiles, and the release guard rejects it (T-P4)
        run: |
          npm run build:bench
          if npm run check:release; then echo "check:release accepted a bench build"; exit 1; fi
      - name: End-to-end tests
        run: |
          npx playwright install --with-deps chromium
          npm run build
          npm run test:e2e
