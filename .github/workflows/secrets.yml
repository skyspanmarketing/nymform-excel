# Secret scanning on every push, over the full history (spec §3).
name: secrets
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: sudo apt-get update && sudo apt-get install -y gitleaks
      - name: Scan full history
        run: gitleaks detect --redact --no-banner -v --log-opts=--all
